name: MacOS Release Build (AMD64)

# Add environment variables at the top level
env:
  MACOS_ASSETS_URL: "https://github.com/pactus-project/pactus/releases/download/v1.7.1/pactus-cli_1.7.1_darwin_amd64.tar.gz"

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.2.3

jobs:
  build-and-release-macos-amd64:
    runs-on: macos-latest

    outputs:
      tag_name: ${{ steps.get_tag_details.outputs.tag_name }}
      release_body: ${{ steps.get_tag_details.outputs.release_body }}
      file_name: ${{ steps.build_macos_app.outputs.file_name }}
      download_link: ${{ steps.prepare_download_links.outputs.download_link }}
      release_link: ${{ steps.prepare_download_links.outputs.release_link }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter Project Dependencies
        run: |
          flutter pub get

      - name: Install macOS Build Dependencies
        run: |
          # Install required dependencies for DMG creation
          brew install create-dmg

      - name: Setup Code Signing
        if: ${{ secrets.MACOS_CERTIFICATE_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
        run: |
          # Create keychain
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD || 'temp_password' }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD || 'temp_password' }}" build.keychain
          
          # Import certificate
          echo "${{ secrets.MACOS_CERTIFICATE_BASE64 }}" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ secrets.KEYCHAIN_PASSWORD || 'temp_password' }}" build.keychain
          
          # Clean up certificate file
          rm certificate.p12

      - name: Prepare Tag Metadata
        id: get_tag_details
        uses: ./.github/actions/utils/extract-tag-metadata
        with:
          github_ref: ${{ github.ref }}

      - name: Build macOS Release Artifacts (DMG)
        id: build_macos_app
        run: |
          # Enable macOS desktop
          flutter config --enable-macos-desktop
          
          # Clean previous builds
          echo "Cleaning previous builds..."
          flutter clean
          rm -rf build/macos

          # Build Flutter macOS app
          echo "Building Flutter macOS app..."
          flutter build macos --release

          # Check if build was successful
          if [ ! -d "build/macos/Build/Products/Release/gui.app" ]; then
              echo "Error: Flutter build failed!"
              exit 1
          fi

          # Set up variables
          APP_NAME="Pactus GUI"
          DMG_NAME="PactusGUI-${{ steps.get_tag_details.outputs.tag_name }}-macos-amd64"
          TEMP_DIR="temp_dmg"
          APP_PATH="build/macos/Build/Products/Release/gui.app"

          echo "Preparing DMG contents..."
          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"

          # Copy the app bundle
          cp -R "$APP_PATH" "$TEMP_DIR/$APP_NAME.app"

          # Download and extract native resources directly to app bundle
          echo "Downloading and copying native resources..."
          curl -L -o pactus-assets.tar.gz ${{ env.MACOS_ASSETS_URL }}
          tar -xzf pactus-assets.tar.gz --strip-components=1 -C "$TEMP_DIR/$APP_NAME.app/Contents/MacOS/"

          # Make native resources executable
          chmod +x "$TEMP_DIR/$APP_NAME.app/Contents/MacOS/pactus"*

          # Fix app bundle ownership and permissions
          echo "Fixing app bundle permissions..."
          sudo chown -R $(whoami):staff "$TEMP_DIR/$APP_NAME.app"
          chmod -R 755 "$TEMP_DIR/$APP_NAME.app"
          chmod +x "$TEMP_DIR/$APP_NAME.app/Contents/MacOS/"*

          # Create the launch script inside the app bundle
          echo "Creating launch wrapper..."
          cat > "$TEMP_DIR/$APP_NAME.app/Contents/MacOS/gui_original" << 'EOF'
          #!/bin/bash

          # Get the directory where this script is located (Contents/MacOS)
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

          # Set the path to native resources for macOS (they're in the same directory)
          export PACTUS_NATIVE_RESOURCES="$HERE"

          # Launch the actual GUI application
          exec "$HERE/gui_flutter" "$@"
          EOF

          # Rename the original executable and replace with our wrapper
          mv "$TEMP_DIR/$APP_NAME.app/Contents/MacOS/gui" "$TEMP_DIR/$APP_NAME.app/Contents/MacOS/gui_flutter"
          mv "$TEMP_DIR/$APP_NAME.app/Contents/MacOS/gui_original" "$TEMP_DIR/$APP_NAME.app/Contents/MacOS/gui"
          chmod +x "$TEMP_DIR/$APP_NAME.app/Contents/MacOS/gui"

          # Code sign the app bundle if certificates are available
          if [[ -n "${{ secrets.MACOS_CERTIFICATE_BASE64 }}" && -n "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" ]]; then
            echo "Code signing app bundle..."
            
            # Find the certificate identity
            CERT_IDENTITY=$(security find-identity -v -p codesigning build.keychain | head -n 1 | grep -o '"[^"]*"' | tr -d '"')
            echo "Using certificate identity: $CERT_IDENTITY"
            
            # Sign all executables and frameworks first
            find "$TEMP_DIR/$APP_NAME.app" -type f \( -name "*.dylib" -o -name "*.framework" \) -exec codesign --force --verify --verbose --sign "$CERT_IDENTITY" {} \;
            find "$TEMP_DIR/$APP_NAME.app/Contents/MacOS" -type f -perm +111 -exec codesign --force --verify --verbose --sign "$CERT_IDENTITY" {} \;
            
            # Sign the main app bundle
            codesign --force --verify --verbose --sign "$CERT_IDENTITY" --entitlements macos/Runner/Release.entitlements --options runtime "$TEMP_DIR/$APP_NAME.app"
            
            # Verify the signature
            codesign --verify --verbose=4 "$TEMP_DIR/$APP_NAME.app"
            
            # Notarize the app if Apple ID credentials are available
            if [[ -n "${{ secrets.APPLE_ID }}" && -n "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" && -n "${{ secrets.APPLE_TEAM_ID }}" ]]; then
              echo "Creating archive for notarization..."
              ditto -c -k --keepParent "$TEMP_DIR/$APP_NAME.app" "$TEMP_DIR/app-for-notarization.zip"
              
              echo "Submitting app for notarization..."
              xcrun notarytool submit "$TEMP_DIR/app-for-notarization.zip" \
                --apple-id "${{ secrets.APPLE_ID }}" \
                --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
                --team-id "${{ secrets.APPLE_TEAM_ID }}" \
                --wait
              
              echo "Stapling notarization to app..."
              xcrun stapler staple "$TEMP_DIR/$APP_NAME.app"
              
              # Clean up notarization archive
              rm "$TEMP_DIR/app-for-notarization.zip"
            else
              echo "Skipping notarization - Apple ID credentials not provided"
            fi
          else
            echo "Skipping code signing - certificates not provided"
          fi

          # Create a symbolic link to Applications folder for easy installation
          ln -s /Applications "$TEMP_DIR/Applications"

          # Create DMG
          echo "Creating DMG file..."
          DMG_PATH="${DMG_NAME}.dmg"
          rm -f "$DMG_PATH"

          # Create the DMG using hdiutil
          hdiutil create -volname "$APP_NAME" -srcfolder "$TEMP_DIR" -ov -format UDZO "$DMG_PATH"

          # Clean up temporary directory and assets
          rm -rf "$TEMP_DIR"
          rm -f pactus-assets.tar.gz
          rm -rf pactus-cli_*

          # Clean up keychain if it was created
          if [[ -n "${{ secrets.MACOS_CERTIFICATE_BASE64 }}" && -n "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" ]]; then
            security delete-keychain build.keychain || true
          fi

          echo "DMG created successfully: $DMG_PATH"
          
          # Set output for the file name
          echo "file_name=${DMG_NAME}.dmg" >> $GITHUB_OUTPUT

      - name: Create Release and Upload DMG
        id: create_release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_tag_details.outputs.tag_name }}
          name: ${{ steps.get_tag_details.outputs.tag_name }}
          body: ${{ steps.get_tag_details.outputs.release_body }}
          files: ./${{ steps.build_macos_app.outputs.file_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Generate Release Download Links
        id: prepare_download_links
        uses: ./.github/actions/utils/generate-download-links
        with:
          tag_name: ${{ steps.get_tag_details.outputs.tag_name }}
          file_name: ${{ steps.build_macos_app.outputs.file_name }}

  notify-macos-amd64:
    needs: build-and-release-macos-amd64
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            🚀 **GUI Release:** ${{ needs.build-and-release-macos-amd64.outputs.tag_name }}   📥[Download MacOs-amd64 Version](${{ needs.build-and-release-macos-amd64.outputs.download_link }})

      - name: Send Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MESSAGE: |
            🚀 **GUI Release:** ${{ needs.build-and-release-macos-amd64.outputs.tag_name }}      📥[Download MacOs-amd64 Version](${{ needs.build-and-release-macos-amd64.outputs.download_link }})
